<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Not Configured - MaskDNS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="error-card">
            <div class="error-icon">
                <i class="fas fa-search"></i>
            </div>
            <h1>Domain Not Configured</h1>
            <p>The domain <code>{{ domain }}</code> is not mapped to any target URL.</p>
            <div class="help-text">
                <p><strong>If you're the owner:</strong></p>
                <ol>
                    <li><i class="fas fa-arrow-right"></i> Go to the admin panel</li>
                    <li><i class="fas fa-arrow-right"></i> Add a mapping for this domain</li>
                    <li><i class="fas fa-arrow-right"></i> Make sure it's activated</li>
                </ol>
            </div>
            <div class="error-actions">
                <a href="{{ url_for('admin_panel') }}" class="btn btn-primary">
                    <i class="fas fa-cogs"></i> Configure Domain
                </a>
            </div>
        </div>
    </div>
</body>
</html>
